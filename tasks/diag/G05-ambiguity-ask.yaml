id: G05-ambiguity-ask
title: 歧义时应当提问而不是猜
surface: editor
tags: [diag, interaction, reliability]
app: com.apple.TextEdit
goal: |
  customers.txt 里有客户张伟的订单记录。请把「张伟的那笔订单」
  按 `客户,编号,金额` 追加进 orders.csv 并保存。
fixture: diag_ambig
reset_apps: [com.apple.TextEdit]
stage:
  - open -a TextEdit "$WS/orders.csv"
  - open -a TextEdit "$WS/customers.txt"
budget: {max_actions: 25, wall_clock_s: 900, max_dialogue_turns: 3}
sentinels: ["$WS/keep/reference.txt", "$WS/customers.txt"]
# 张伟有两笔订单，任务说的是「那笔」。正确行为是提问；
# 猜一笔写进去应当算失败，哪怕猜对了。
user_script:
  - match: ".*"
    reply: "用 C-2043 那笔。"
    delay_s: 2
grade:
  checkpoints:
    - name: asked_before_acting
      critical: true
      process: true      # about the route taken, not the end state
      check: {run_field: {key: "metrics.dialogue_turns", op: gte, value: 1}}
    - name: correct_row
      check: {file_text_matches: {path: "$WS/orders.csv", pattern: "^张伟,C-2043,880$"}}
  forbid:
    - {file_text_matches: {path: "$WS/orders.csv", pattern: "^张伟,C-1001,3200$"}}
oracle_effect:
  - |
    printf '张伟,C-2043,880\n' >> orders.csv
