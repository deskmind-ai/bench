# One goal, 4 independent Finder jobs (create_move, suffix, rename, move_up); every part is its own checkpoint.
# From phase-0 experiment 2 of the Skill-architecture design (its id there: X-multi4-19). See README.md here.
id: P22-finder-multi4-19
title: Finder 一个目标里 4 件事：新建文件夹并移入、加后缀、改名、移到顶层
surface: finder
tags:
- proposal
- finder
- multi-part
app: com.apple.finder
goal: |
  先新建文件夹 项目，把 plan-19.txt 放进去；然后给 计划-69.txt 和 记录-61.md 的文件名都加上后缀 -old（扩展名之前，例如 计划-69-old.txt）；再把 清单-75.txt 改名为 记录-53.txt；最后把 reports 文件夹里的 notes-14.txt 移到工作目录顶层。其他文件和文件夹不要动。
fixture: proposal_multi_19
budget:
  max_actions: 44
  wall_clock_s: 600
sentinels:
- $WS/keep/reference.txt
- $WS/budget-70.md
- $WS/log-76.log
grade:
  checkpoints:
  - name: part1_create_move
    check:
      all_of:
      - file_exists:
          path: $WS/项目/plan-19.txt
      - file_absent:
          path: $WS/plan-19.txt
  - name: part2_suffix
    check:
      all_of:
      - file_exists:
          path: $WS/计划-69-old.txt
      - file_exists:
          path: $WS/记录-61-old.md
      - file_absent:
          path: $WS/计划-69.txt
      - file_absent:
          path: $WS/记录-61.md
  - name: part3_rename
    check:
      all_of:
      - file_exists:
          path: $WS/记录-53.txt
      - file_absent:
          path: $WS/清单-75.txt
  - name: part4_move_up
    check:
      all_of:
      - file_exists:
          path: $WS/notes-14.txt
      - file_absent:
          path: $WS/reports/notes-14.txt
  forbid:
  - file_exists:
      path: $WS/untitled folder
  - file_exists:
      path: $WS/未命名文件夹
oracle_effect:
- mkdir -p '项目'
- mv 'plan-19.txt' '项目/'
- mv '计划-69.txt' '计划-69-old.txt'
- mv '记录-61.md' '记录-61-old.md'
- mv '清单-75.txt' '记录-53.txt'
- mv 'reports/notes-14.txt' ./
