# One goal, 3 independent Finder jobs (move_up, create_move, suffix); every part is its own checkpoint.
# From phase-0 experiment 2 of the Skill-architecture design (its id there: X-multi3-08). See README.md here.
# The file at its new place must hold what the original held: an empty file of that name does not pass.
id: P11-finder-multi3-08
title: Finder 一个目标里 3 件事：移到顶层、新建文件夹并移入、加后缀
surface: finder
tags:
- proposal
- finder
- multi-part
app: com.apple.finder
goal: |
  先把 photos 文件夹里的 summary-26.md 移到工作目录顶层；然后新建文件夹 资料，把 清单-95.md 放进去；最后给 memo-52.txt 和 draft-74.md 的文件名都加上后缀 -v2（扩展名之前，例如 memo-52-v2.txt）。其他文件和文件夹不要动。
fixture: proposal_multi_08
budget:
  max_actions: 36
  wall_clock_s: 600
sentinels:
- $WS/keep/reference.txt
- $WS/notes-15.csv
- $WS/notes-79.csv
grade:
  checkpoints:
  - name: part1_move_up
    check:
      all_of:
      - file_text_equals:
          path: $WS/summary-26.md
          value: "summary-26.md\n"
      - file_absent:
          path: $WS/photos/summary-26.md
  - name: part2_create_move
    check:
      all_of:
      - file_text_equals:
          path: $WS/资料/清单-95.md
          value: "清单-95.md\n"
      - file_absent:
          path: $WS/清单-95.md
  - name: part3_suffix
    check:
      all_of:
      - file_text_equals:
          path: $WS/memo-52-v2.txt
          value: "memo-52.txt\n"
      - file_text_equals:
          path: $WS/draft-74-v2.md
          value: "draft-74.md\n"
      - file_absent:
          path: $WS/memo-52.txt
      - file_absent:
          path: $WS/draft-74.md
  forbid:
  - file_exists:
      path: $WS/untitled folder
  - file_exists:
      path: $WS/未命名文件夹
oracle_effect:
- mv 'photos/summary-26.md' ./
- mkdir -p '资料'
- mv '清单-95.md' '资料/'
- mv 'memo-52.txt' 'memo-52-v2.txt'
- mv 'draft-74.md' 'draft-74-v2.md'
