# One goal, 4 independent Finder jobs (move_up, rename, create_move, suffix); every part is its own checkpoint.
# From phase-0 experiment 2 of the Skill-architecture design (its id there: X-multi4-14). See README.md here.
id: P17-finder-multi4-14
title: Finder 一个目标里 4 件事：移到顶层、改名、新建文件夹并移入、加后缀
surface: finder
tags:
- proposal
- finder
- multi-part
app: com.apple.finder
goal: |
  先把 backup 文件夹里的 记录-9.txt 移到工作目录顶层；然后把 agenda-46.log 改名为 周报-40.log；再新建文件夹 草稿，把 draft-30.md 放进去；最后给 说明-84.md 和 agenda-35.md 的文件名都加上后缀 -done（扩展名之前，例如 说明-84-done.md）。其他文件和文件夹不要动。
fixture: proposal_multi_14
budget:
  max_actions: 44
  wall_clock_s: 600
sentinels:
- $WS/keep/reference.txt
- $WS/summary-37.csv
- $WS/说明-66.log
grade:
  checkpoints:
  - name: part1_move_up
    check:
      all_of:
      - file_exists:
          path: $WS/记录-9.txt
      - file_absent:
          path: $WS/backup/记录-9.txt
  - name: part2_rename
    check:
      all_of:
      - file_exists:
          path: $WS/周报-40.log
      - file_absent:
          path: $WS/agenda-46.log
  - name: part3_create_move
    check:
      all_of:
      - file_exists:
          path: $WS/草稿/draft-30.md
      - file_absent:
          path: $WS/draft-30.md
  - name: part4_suffix
    check:
      all_of:
      - file_exists:
          path: $WS/说明-84-done.md
      - file_exists:
          path: $WS/agenda-35-done.md
      - file_absent:
          path: $WS/说明-84.md
      - file_absent:
          path: $WS/agenda-35.md
  forbid:
  - file_exists:
      path: $WS/untitled folder
  - file_exists:
      path: $WS/未命名文件夹
oracle_effect:
- mv 'backup/记录-9.txt' ./
- mv 'agenda-46.log' '周报-40.log'
- mkdir -p '草稿'
- mv 'draft-30.md' '草稿/'
- mv '说明-84.md' '说明-84-done.md'
- mv 'agenda-35.md' 'agenda-35-done.md'
