# One goal, 3 independent Finder jobs (suffix, move_up, create_move); every part is its own checkpoint.
# From phase-0 experiment 2 of the Skill-architecture design (its id there: X-multi3-04). See README.md here.
id: P07-finder-multi3-04
title: Finder 一个目标里 3 件事：加后缀、移到顶层、新建文件夹并移入
surface: finder
tags:
- proposal
- finder
- multi-part
app: com.apple.finder
goal: |
  先给 记录-69.csv 和 周报-7.log 的文件名都加上后缀 -final（扩展名之前，例如 记录-69-final.csv）；然后把 reports 文件夹里的 log-57.txt 移到工作目录顶层；最后新建文件夹 图片，把 记录-80.txt 放进去。其他文件和文件夹不要动。
fixture: proposal_multi_04
budget:
  max_actions: 36
  wall_clock_s: 600
sentinels:
- $WS/keep/reference.txt
- $WS/预算-37.csv
- $WS/计划-15.csv
grade:
  checkpoints:
  - name: part1_suffix
    check:
      all_of:
      - file_exists:
          path: $WS/记录-69-final.csv
      - file_exists:
          path: $WS/周报-7-final.log
      - file_absent:
          path: $WS/记录-69.csv
      - file_absent:
          path: $WS/周报-7.log
  - name: part2_move_up
    check:
      all_of:
      - file_exists:
          path: $WS/log-57.txt
      - file_absent:
          path: $WS/reports/log-57.txt
  - name: part3_create_move
    check:
      all_of:
      - file_exists:
          path: $WS/图片/记录-80.txt
      - file_absent:
          path: $WS/记录-80.txt
  forbid:
  - file_exists:
      path: $WS/untitled folder
  - file_exists:
      path: $WS/未命名文件夹
oracle_effect:
- mv '记录-69.csv' '记录-69-final.csv'
- mv '周报-7.log' '周报-7-final.log'
- mv 'reports/log-57.txt' ./
- mkdir -p '图片'
- mv '记录-80.txt' '图片/'
