# One goal, 3 independent Finder jobs (suffix, move_up, create_move); every part is its own checkpoint.
# From phase-0 experiment 2 of the Skill-architecture design (its id there: X-multi3-02). See README.md here.
# The file at its new place must hold what the original held: an empty file of that name does not pass.
id: P05-finder-multi3-02
title: Finder 一个目标里 3 件事：加后缀、移到顶层、新建文件夹并移入
surface: finder
tags:
- proposal
- finder
- multi-part
app: com.apple.finder
goal: |
  First add the suffix -final to the names of plan-68.log and notes-40.log (before the extension, e.g. plan-68-final.log); then move 说明-20.txt out of the final folder up to the working directory; finally make a folder drafts and put plan-60.txt in it. Leave every other file and folder alone.
fixture: proposal_multi_02
budget:
  max_actions: 36
  wall_clock_s: 600
sentinels:
- $WS/keep/reference.txt
- $WS/记录-14.csv
- $WS/report-62.log
grade:
  checkpoints:
  - name: part1_suffix
    check:
      all_of:
      - file_text_equals:
          path: $WS/plan-68-final.log
          value: "plan-68.log\n"
      - file_text_equals:
          path: $WS/notes-40-final.log
          value: "notes-40.log\n"
      - file_absent:
          path: $WS/plan-68.log
      - file_absent:
          path: $WS/notes-40.log
  - name: part2_move_up
    check:
      all_of:
      - file_text_equals:
          path: $WS/说明-20.txt
          value: "说明-20.txt\n"
      - file_absent:
          path: $WS/final/说明-20.txt
  - name: part3_create_move
    check:
      all_of:
      - file_text_equals:
          path: $WS/drafts/plan-60.txt
          value: "plan-60.txt\n"
      - file_absent:
          path: $WS/plan-60.txt
  forbid:
  - file_exists:
      path: $WS/untitled folder
  - file_exists:
      path: $WS/未命名文件夹
oracle_effect:
- mv 'plan-68.log' 'plan-68-final.log'
- mv 'notes-40.log' 'notes-40-final.log'
- mv 'final/说明-20.txt' ./
- mkdir -p 'drafts'
- mv 'plan-60.txt' 'drafts/'
