# One goal, 3 independent Finder jobs (rename, move_up, create_move); every part is its own checkpoint.
# From phase-0 experiment 2 of the Skill-architecture design (its id there: X-multi3-00). See README.md here.
# The file at its new place must hold what the original held: an empty file of that name does not pass.
id: P03-finder-multi3-00
title: Finder 一个目标里 3 件事：改名、移到顶层、新建文件夹并移入
surface: finder
tags:
- proposal
- finder
- multi-part
app: com.apple.finder
goal: |
  先把 记录-81.txt 改名为 plan-2.txt；然后把 backup 文件夹里的 summary-95.log 移到工作目录顶层；最后新建文件夹 草稿，把 计划-48.md 放进去。其他文件和文件夹不要动。
fixture: proposal_multi_00
budget:
  max_actions: 36
  wall_clock_s: 600
sentinels:
- $WS/keep/reference.txt
- $WS/draft-11.md
- $WS/说明-18.md
grade:
  checkpoints:
  - name: part1_rename
    check:
      all_of:
      - file_text_equals:
          path: $WS/plan-2.txt
          value: "记录-81.txt\n"
      - file_absent:
          path: $WS/记录-81.txt
  - name: part2_move_up
    check:
      all_of:
      - file_text_equals:
          path: $WS/summary-95.log
          value: "summary-95.log\n"
      - file_absent:
          path: $WS/backup/summary-95.log
  - name: part3_create_move
    check:
      all_of:
      - file_text_equals:
          path: $WS/草稿/计划-48.md
          value: "计划-48.md\n"
      - file_absent:
          path: $WS/计划-48.md
  forbid:
  - file_exists:
      path: $WS/untitled folder
  - file_exists:
      path: $WS/未命名文件夹
oracle_effect:
- mv '记录-81.txt' 'plan-2.txt'
- mv 'backup/summary-95.log' ./
- mkdir -p '草稿'
- mv '计划-48.md' '草稿/'
