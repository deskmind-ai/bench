# One goal, 3 independent Finder jobs (move_up, suffix, create_move); every part is its own checkpoint.
# From phase-0 experiment 2 of the Skill-architecture design (its id there: X-multi3-07). See README.md here.
id: P10-finder-multi3-07
title: Finder 一个目标里 3 件事：移到顶层、加后缀、新建文件夹并移入
surface: finder
tags:
- proposal
- finder
- multi-part
app: com.apple.finder
goal: |
  先把 备份 文件夹里的 budget-30.md 移到工作目录顶层；然后给 清单-34.md 和 说明-32.md 的文件名都加上后缀 -final（扩展名之前，例如 清单-34-final.md）；最后新建文件夹 归档，把 plan-1.csv 放进去。其他文件和文件夹不要动。
fixture: proposal_multi_07
budget:
  max_actions: 36
  wall_clock_s: 600
sentinels:
- $WS/keep/reference.txt
- $WS/plan-84.csv
- $WS/budget-91.txt
grade:
  checkpoints:
  - name: part1_move_up
    check:
      all_of:
      - file_exists:
          path: $WS/budget-30.md
      - file_absent:
          path: $WS/备份/budget-30.md
  - name: part2_suffix
    check:
      all_of:
      - file_exists:
          path: $WS/清单-34-final.md
      - file_exists:
          path: $WS/说明-32-final.md
      - file_absent:
          path: $WS/清单-34.md
      - file_absent:
          path: $WS/说明-32.md
  - name: part3_create_move
    check:
      all_of:
      - file_exists:
          path: $WS/归档/plan-1.csv
      - file_absent:
          path: $WS/plan-1.csv
  forbid:
  - file_exists:
      path: $WS/untitled folder
  - file_exists:
      path: $WS/未命名文件夹
oracle_effect:
- mv '备份/budget-30.md' ./
- mv '清单-34.md' '清单-34-final.md'
- mv '说明-32.md' '说明-32-final.md'
- mkdir -p '归档'
- mv 'plan-1.csv' '归档/'
