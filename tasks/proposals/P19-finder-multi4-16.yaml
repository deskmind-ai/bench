# One goal, 4 independent Finder jobs (move_up, suffix, create_move, rename); every part is its own checkpoint.
# From phase-0 experiment 2 of the Skill-architecture design (its id there: X-multi4-16). See README.md here.
id: P19-finder-multi4-16
title: Finder 一个目标里 4 件事：移到顶层、加后缀、新建文件夹并移入、改名
surface: finder
tags:
- proposal
- finder
- multi-part
app: com.apple.finder
goal: |
  先把 old 文件夹里的 说明-79.csv 移到工作目录顶层；然后给 清单-71.md 和 memo-52.csv 的文件名都加上后缀 -v2（扩展名之前，例如 清单-71-v2.md）；再新建文件夹 drafts，把 summary-13.txt 放进去；最后把 report-46.md 改名为 周报-98.md。其他文件和文件夹不要动。
fixture: proposal_multi_16
budget:
  max_actions: 44
  wall_clock_s: 600
sentinels:
- $WS/keep/reference.txt
- $WS/计划-47.md
- $WS/说明-52.csv
grade:
  checkpoints:
  - name: part1_move_up
    check:
      all_of:
      - file_exists:
          path: $WS/说明-79.csv
      - file_absent:
          path: $WS/old/说明-79.csv
  - name: part2_suffix
    check:
      all_of:
      - file_exists:
          path: $WS/清单-71-v2.md
      - file_exists:
          path: $WS/memo-52-v2.csv
      - file_absent:
          path: $WS/清单-71.md
      - file_absent:
          path: $WS/memo-52.csv
  - name: part3_create_move
    check:
      all_of:
      - file_exists:
          path: $WS/drafts/summary-13.txt
      - file_absent:
          path: $WS/summary-13.txt
  - name: part4_rename
    check:
      all_of:
      - file_exists:
          path: $WS/周报-98.md
      - file_absent:
          path: $WS/report-46.md
  forbid:
  - file_exists:
      path: $WS/untitled folder
  - file_exists:
      path: $WS/未命名文件夹
oracle_effect:
- mv 'old/说明-79.csv' ./
- mv '清单-71.md' '清单-71-v2.md'
- mv 'memo-52.csv' 'memo-52-v2.csv'
- mkdir -p 'drafts'
- mv 'summary-13.txt' 'drafts/'
- mv 'report-46.md' '周报-98.md'
