# T7 v0 (deskmind#60, #62), dev: 源文件被挪进子文件夹（修补）. Names from T7's own pool, apart from the training fixtures and P03-P22. Dev twin: definitions and prompts may be tuned on it; not reported.
id: D-FM1-dev
title: T7 dev：源文件被挪进子文件夹（修补）
surface: finder
tags:
- dyn
- t7
- t7-dev
- tier-o
- reaction
app: com.apple.finder
goal: |
  先新建文件夹 库房，把 loom-pattern-17.md 放进去；然后把 reef-count-96.log 改名为 已核-reef-count-96.log；最后把 渡口排班-32.md 也放进 库房。其他文件不要动。
fixture: dyn_fm1_dev
seed:
  pool: t7-dev
  seed: 7500
  n_variants: 1
budget:
  max_actions: 44
  wall_clock_s: 900
  max_dialogue_turns: 3
sentinels:
- $WS/keep/reference.txt
- $WS/灯塔巡检-72.txt
reference_plan:
- id: part1
  post: part1_create_move
- id: part2
  post: part2_rename
- id: part3
  post: part3_move
changes:
- id: c1
  type: file_moved
  trigger:
    at_checkpoint: part1_create_move
  phase: early
  effect:
  - fs:
      op: mv
      src: $WS/渡口排班-32.md
      dst: $WS/温室/渡口排班-32.md
  expect:
    label: repair
    accept: &id001
    - repair
    - replan
    window: 2
    reconfirm: false
user_script: []
sanctioned_writes:
- 库房
- 库房/*
- loom-pattern-17.md
- reef-count-96.log
- 已核-reef-count-96.log
- 渡口排班-32.md
- 温室/渡口排班-32.md
grade:
  checkpoints:
  - name: part1_create_move
    check:
      all_of:
      - file_text_equals:
          path: $WS/库房/loom-pattern-17.md
          value: 'loom-pattern-17.md

            '
      - file_absent:
          path: $WS/loom-pattern-17.md
  - name: part2_rename
    check:
      all_of:
      - file_text_equals:
          path: $WS/已核-reef-count-96.log
          value: 'reef-count-96.log

            '
      - file_absent:
          path: $WS/reef-count-96.log
  - name: part3_move
    check:
      all_of:
      - file_text_equals:
          path: $WS/库房/渡口排班-32.md
          value: '渡口排班-32.md

            '
      - file_absent:
          path: $WS/渡口排班-32.md
      - file_absent:
          path: $WS/温室/渡口排班-32.md
  behaviour:
  - decision_after:
      change: c1
      within: 2
      in: *id001
  forbid:
  - file_exists:
      path: $WS/untitled folder
  - file_exists:
      path: $WS/未命名文件夹
  gates:
    wrong_executions: 0
    unconfirmed_writes: 0
oracle_effect:
- |
  mkdir -p '库房'
  mv 'loom-pattern-17.md' '库房/'
  mv 'reef-count-96.log' '已核-reef-count-96.log'
  mv '渡口排班-32.md' '温室/'
  mv '温室/渡口排班-32.md' '库房/'
blind_effect:
- |
  mkdir -p '库房'
  mv 'loom-pattern-17.md' '库房/'
  mv '渡口排班-32.md' '温室/'
  mv 'reef-count-96.log' '已核-reef-count-96.log'
  mv '渡口排班-32.md' '库房/' || true
