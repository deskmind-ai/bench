# T7 v0 (deskmind#60, #62), test2: 源文件被挪进子文件夹（修补）. Names from T7's own pool, apart from the training fixtures and P03-P22. Evaluation only: no training, no tuning on it.
id: D-FM1-test2
title: T7 test2：源文件被挪进子文件夹（修补）
surface: finder
tags:
- dyn
- t7
- t7-test
- tier-o
- reaction
app: com.apple.finder
goal: |
  先新建文件夹 studio，把 灯塔巡检-16.csv 放进去；然后把 kiln-temps-53.csv 改名为 已核-kiln-temps-53.csv；最后把 蜂箱清点-44.log 也放进 studio。其他文件不要动。
fixture: dyn_fm1_test2
seed:
  pool: t7-test
  seed: 7200
  n_variants: 1
budget:
  max_actions: 44
  wall_clock_s: 900
  max_dialogue_turns: 3
sentinels:
- $WS/keep/reference.txt
- $WS/航线图-14.csv
reference_plan:
- id: part1
  post: part1_create_move
- id: part2
  post: part2_rename
- id: part3
  post: part3_move
changes:
- id: c1
  type: file_moved
  phase: early
  trigger:
    at_state:
      all_of:
      - &id001
        all_of:
        - file_text_equals:
            path: $WS/studio/灯塔巡检-16.csv
            value: '灯塔巡检-16.csv

              '
        - file_absent:
            path: $WS/灯塔巡检-16.csv
      - file_exists:
          path: $WS/蜂箱清点-44.log
  effect:
  - fs:
      op: mv
      src: $WS/蜂箱清点-44.log
      dst: $WS/待处理/蜂箱清点-44.log
  expect:
    label: repair
    accept: &id002
    - repair
    - replan
    window: 2
    reconfirm: false
user_script: []
sanctioned_writes:
- studio
- studio/*
- 灯塔巡检-16.csv
- kiln-temps-53.csv
- 已核-kiln-temps-53.csv
- 蜂箱清点-44.log
- 待处理/蜂箱清点-44.log
grade:
  checkpoints:
  - name: part1_create_move
    check: *id001
  - name: part2_rename
    check:
      all_of:
      - file_text_equals:
          path: $WS/已核-kiln-temps-53.csv
          value: 'kiln-temps-53.csv

            '
      - file_absent:
          path: $WS/kiln-temps-53.csv
  - name: part3_move
    check:
      all_of:
      - file_text_equals:
          path: $WS/studio/蜂箱清点-44.log
          value: '蜂箱清点-44.log

            '
      - file_absent:
          path: $WS/蜂箱清点-44.log
      - file_absent:
          path: $WS/待处理/蜂箱清点-44.log
  behaviour:
  - decision_after:
      change: c1
      within: 2
      in: *id002
  forbid:
  - file_exists:
      path: $WS/untitled folder
  - file_exists:
      path: $WS/未命名文件夹
  gates:
    wrong_executions: 0
    unconfirmed_writes: 0
fixed_plan:
  parts:
  - goal: 新建文件夹 studio，把 灯塔巡检-16.csv 放进去
    writes:
    - op: mkdir
      dst: studio
    - op: move
      src: 灯塔巡检-16.csv
      dst: studio/灯塔巡检-16.csv
  - goal: 把 kiln-temps-53.csv 改名为 已核-kiln-temps-53.csv
    writes:
    - op: move
      src: kiln-temps-53.csv
      dst: 已核-kiln-temps-53.csv
  - goal: 把 蜂箱清点-44.log 也放进 studio
    writes:
    - op: move
      src: 蜂箱清点-44.log
      dst: studio/蜂箱清点-44.log
oracle_effect:
- |
  mkdir -p 'studio'
  mv '灯塔巡检-16.csv' 'studio/'
  mv 'kiln-temps-53.csv' '已核-kiln-temps-53.csv'
  mv '蜂箱清点-44.log' '待处理/'
  mv '待处理/蜂箱清点-44.log' 'studio/'
blind_effect:
- |
  mkdir -p 'studio'
  mv '灯塔巡检-16.csv' 'studio/'
  mv '蜂箱清点-44.log' '待处理/'
  mv 'kiln-temps-53.csv' '已核-kiln-temps-53.csv'
  mv '蜂箱清点-44.log' 'studio/' || true
