# T7 v0 (deskmind#60, #62), test: 「第三件不用做了」（修补）. Names from T7's own pool, apart from the training fixtures and P03-P22. Evaluation only: no training, no tuning on it.
id: D-UA2-test
title: T7 test：「第三件不用做了」（修补）
surface: finder
tags:
