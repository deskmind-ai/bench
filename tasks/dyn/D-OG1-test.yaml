# T7 v0 (deskmind#60, #62), test: 开放目标「整理一下」，没给规则（先问）. Names from T7's own pool, apart from the training fixtures and P03-P22. Evaluation only: no training, no tuning on it.
id: D-OG1-test
title: T7 test：开放目标「整理一下」，没给规则（先问）
surface: finder
tags:
- dyn
- t7
- t7-test
- tier-o
- reaction
