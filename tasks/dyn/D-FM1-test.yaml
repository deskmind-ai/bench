# T7 v0 (deskmind#60, #62), test: 源文件被挪进子文件夹（修补）. Names from T7's own pool, apart from the training fixtures and P03-P22. Evaluation only: no training, no tuning on it.
id: D-FM1-test
title: T7 test：源文件被挪进子文件夹（修补）
surface: finder
tags:
- dyn
- t7
- t7-test
- tier-o
- reaction
app: com.apple.finder
goal: |
  先新建文件夹 inbox-old，把 窑温曲线-10.txt 放进去；然后把 harbor-tides-56.md 改名为 已核-harbor-tides-56.md；最后把 oak-survey-38.txt 也放进 inbox-old。其他文件不要动。
fixture: dyn_fm1_test
seed:
  pool: t7-test
  seed: 7100
  n_variants: 1
budget:
  max_actions: 44
  wall_clock_s: 900
  max_dialogue_turns: 3
sentinels:
- $WS/keep/reference.txt
- $WS/glacier-map-62.log
reference_plan:
- id: part1
  post: part1_create_move
- id: part2
  post: part2_rename
- id: part3
  post: part3_move
changes:
- id: c1
  type: file_moved
  trigger:
    at_checkpoint: part1_create_move
  phase: early
  effect:
  - fs:
      op: mv
      src: $WS/oak-survey-38.txt
      dst: $WS/库房/oak-survey-38.txt
  expect:
    label: repair
    accept: &id001
    - repair
    - replan
    window: 2
    reconfirm: false
user_script: []
sanctioned_writes:
- inbox-old
- inbox-old/*
- 窑温曲线-10.txt
- harbor-tides-56.md
- 已核-harbor-tides-56.md
- oak-survey-38.txt
- 库房/oak-survey-38.txt
grade:
  checkpoints:
  - name: part1_create_move
    check:
      all_of:
      - file_text_equals:
          path: $WS/inbox-old/窑温曲线-10.txt
          value: '窑温曲线-10.txt

            '
      - file_absent:
          path: $WS/窑温曲线-10.txt
  - name: part2_rename
    check:
      all_of:
      - file_text_equals:
          path: $WS/已核-harbor-tides-56.md
          value: 'harbor-tides-56.md

            '
      - file_absent:
          path: $WS/harbor-tides-56.md
  - name: part3_move
    check:
      all_of:
      - file_text_equals:
          path: $WS/inbox-old/oak-survey-38.txt
          value: 'oak-survey-38.txt

            '
      - file_absent:
          path: $WS/oak-survey-38.txt
      - file_absent:
          path: $WS/库房/oak-survey-38.txt
  behaviour:
  - decision_after:
      change: c1
      within: 2
      in: *id001
  forbid:
  - file_exists:
      path: $WS/untitled folder
  - file_exists:
      path: $WS/未命名文件夹
  gates:
    wrong_executions: 0
    unconfirmed_writes: 0
oracle_effect:
- |
  mkdir -p 'inbox-old'
  mv '窑温曲线-10.txt' 'inbox-old/'
  mv 'harbor-tides-56.md' '已核-harbor-tides-56.md'
  mv 'oak-survey-38.txt' '库房/'
  mv '库房/oak-survey-38.txt' 'inbox-old/'
blind_effect:
- |
  mkdir -p 'inbox-old'
  mv '窑温曲线-10.txt' 'inbox-old/'
  mv 'oak-survey-38.txt' '库房/'
  mv 'harbor-tides-56.md' '已核-harbor-tides-56.md'
  mv 'oak-survey-38.txt' 'inbox-old/' || true
