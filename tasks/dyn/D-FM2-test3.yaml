# T7 v0 (deskmind#60, #62), test3: 来源文件夹改了名（重新规划）. Names from T7's own pool, apart from the training fixtures and P03-P22. Evaluation only: no training, no tuning on it.
id: D-FM2-test3
title: T7 test3：来源文件夹改了名（重新规划）
surface: finder
tags:
- dyn
- t7
- t7-test
- tier-o
- reaction
app: com.apple.finder
goal: |
  先把 field 里的 梯田测绘-16.csv 移到工作目录顶层；然后新建文件夹 温室，把 field 里的 蜂箱清点-17.csv 放进去；最后把 field 里的 潮汐表-15.csv 也放进 温室。其他文件不要动。
fixture: dyn_fm2_test3
seed:
  pool: t7-test
  seed: 7301
  n_variants: 1
budget:
  max_actions: 44
  wall_clock_s: 900
  max_dialogue_turns: 3
sentinels:
- $WS/keep/reference.txt
- $WS/kiln-temps-80.log
reference_plan:
- id: part1
  post: part1_move_up
- id: part2
  post: part2_create_move
- id: part3
  post: part3_move
changes:
- id: c1
  type: file_moved
  trigger:
    at_checkpoint: part1_move_up
  phase: early
  effect:
  - fs:
      op: rename
      src: $WS/field
      dst: $WS/field-旧
  expect:
    label: replan
    accept: &id001
    - replan
    - repair
    window: 2
    reconfirm: false
user_script: []
sanctioned_writes:
- 梯田测绘-16.csv
- 温室
- 温室/*
- field/*
- field-旧/*
grade:
  checkpoints:
  - name: part1_move_up
    check:
      all_of:
      - file_text_equals:
          path: $WS/梯田测绘-16.csv
          value: '梯田测绘-16.csv

            '
      - file_absent:
          path: $WS/field/梯田测绘-16.csv
  - name: part2_create_move
    check:
      all_of:
      - file_text_equals:
          path: $WS/温室/蜂箱清点-17.csv
          value: '蜂箱清点-17.csv

            '
      - file_absent:
          path: $WS/field-旧/蜂箱清点-17.csv
      - file_absent:
          path: $WS/field/蜂箱清点-17.csv
  - name: part3_move
    check:
      all_of:
      - file_text_equals:
          path: $WS/温室/潮汐表-15.csv
          value: '潮汐表-15.csv

            '
      - file_absent:
          path: $WS/field-旧/潮汐表-15.csv
      - file_absent:
          path: $WS/field/潮汐表-15.csv
  behaviour:
  - decision_after:
      change: c1
      within: 2
      in: *id001
  forbid:
  - file_exists:
      path: $WS/untitled folder
  - file_exists:
      path: $WS/未命名文件夹
  gates:
    wrong_executions: 0
    unconfirmed_writes: 0
fixed_plan:
  parts:
  - goal: 把 field 里的 梯田测绘-16.csv 移到工作目录顶层
    writes:
    - op: move
      src: field/梯田测绘-16.csv
      dst: 梯田测绘-16.csv
  - goal: 新建文件夹 温室，把 field 里的 蜂箱清点-17.csv 放进去
    writes:
    - op: mkdir
      dst: 温室
    - op: move
      src: field/蜂箱清点-17.csv
      dst: 温室/蜂箱清点-17.csv
  - goal: 把 field 里的 潮汐表-15.csv 也放进 温室
    writes:
    - op: move
      src: field/潮汐表-15.csv
      dst: 温室/潮汐表-15.csv
oracle_effect:
- |
  mv 'field/梯田测绘-16.csv' .
  mv 'field' 'field-旧'
  mkdir -p '温室'
  mv 'field-旧/蜂箱清点-17.csv' '温室/'
  mv 'field-旧/潮汐表-15.csv' '温室/'
blind_effect:
- |
  mv 'field/梯田测绘-16.csv' .
  mv 'field' 'field-旧'
  mkdir -p '温室'
  mv 'field/蜂箱清点-17.csv' '温室/' || true
  mv 'field/潮汐表-15.csv' '温室/' || true
