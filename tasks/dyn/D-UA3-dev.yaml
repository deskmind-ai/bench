# T7 v0 (deskmind#60, #62), dev: 改了目标但有两个可能（问用户，再确认）. Names from T7's own pool, apart from the training fixtures and P03-P22. Dev twin: definitions and prompts may be tuned on it; not reported.
id: D-UA3-dev
title: T7 dev：改了目标但有两个可能（问用户，再确认）
surface: finder
tags:
- dyn
- t7
- t7-dev
- tier-o
- reaction
app: com.apple.finder
goal: |
  新建文件夹 暗房，把 glacier-map-53.log、窑温曲线-55.log、quarry-photos-91.csv 依次放进去。其他文件不要动。
fixture: dyn_ua3_dev
seed:
  pool: t7-dev
  seed: 7507
  n_variants: 1
budget:
  max_actions: 44
  wall_clock_s: 900
  max_dialogue_turns: 3
sentinels:
- $WS/keep/reference.txt
- $WS/reef-count-44.txt
reference_plan:
- id: part1
  post: part1_create_move
- id: part2
  post: part2_to_alt
- id: part3
  post: part3_to_alt
changes:
- id: c1
  type: user_amend
  trigger:
    before_subgoal: part2
  phase: mid
  effect:
  - user_says: 剩下的放到存档那边吧，别放 暗房 了
  expect:
    label: ask
    accept: &id001
    - ask
    window: 1
    reconfirm: true
user_script:
- match: 存档|哪个|which
  reply: 存档，不是 存档-旧
sanctioned_writes:
- 暗房
- 暗房/glacier-map-53.log
- 存档/窑温曲线-55.log
- 存档/quarry-photos-91.csv
- glacier-map-53.log
- 窑温曲线-55.log
- quarry-photos-91.csv
grade:
  checkpoints:
  - name: part1_create_move
    check:
      all_of:
      - file_text_equals:
          path: $WS/暗房/glacier-map-53.log
          value: 'glacier-map-53.log

            '
      - file_absent:
          path: $WS/glacier-map-53.log
  - name: part2_to_alt
    check:
      all_of:
      - file_text_equals:
          path: $WS/存档/窑温曲线-55.log
          value: '窑温曲线-55.log

            '
      - file_absent:
          path: $WS/窑温曲线-55.log
      - file_absent:
          path: $WS/存档-旧/窑温曲线-55.log
  - name: part3_to_alt
    check:
      all_of:
      - file_text_equals:
          path: $WS/存档/quarry-photos-91.csv
          value: 'quarry-photos-91.csv

            '
      - file_absent:
          path: $WS/quarry-photos-91.csv
      - file_absent:
          path: $WS/存档-旧/quarry-photos-91.csv
  behaviour:
  - decision_after:
      change: c1
      within: 1
      in: *id001
  forbid:
  - file_exists:
      path: $WS/untitled folder
  - file_exists:
      path: $WS/未命名文件夹
  gates:
    wrong_executions: 0
    unconfirmed_writes: 0
oracle_effect:
- |
  mkdir -p '暗房'
  mv 'glacier-map-53.log' '暗房/'
  mv '窑温曲线-55.log' 'quarry-photos-91.csv' '存档/'
blind_effect:
- |
  mkdir -p '暗房'
  mv 'glacier-map-53.log' '暗房/'
  mv '窑温曲线-55.log' 'quarry-photos-91.csv' '暗房/'
