  reply: 存档，不是 存档-旧
sanctioned_writes:
- 暗房
- 暗房/oak-survey-92.log
- 存档/星图草案-29.md
- 存档/kiln-temps-54.md
- oak-survey-92.log
- 星图草案-29.md
- kiln-temps-54.md
grade:
  checkpoints:
  - name: part1_create_move
    check:
      all_of:
      - file_text_equals:
          path: $WS/暗房/oak-survey-92.log
          value: 'oak-survey-92.log

            '
      - file_absent:
          path: $WS/oak-survey-92.log
  - name: part2_to_alt
    check:
      all_of:
      - file_text_equals:
