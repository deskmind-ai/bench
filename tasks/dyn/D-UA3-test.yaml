changes:
- id: c1
  type: user_amend
  trigger:
    before_subgoal: part2
  phase: mid
  effect:
  - user_says: 剩下的放到存档那边吧，别放 暗房 了
  expect:
    label: ask
    accept: &id001
    - ask
    window: 1
    reconfirm: true
user_script:
