      - file_text_equals:
          path: $WS/青石/青石-loom-pattern-53.md
          value: '青石-loom-pattern-53.md

            '
      - file_absent:
          path: $WS/青石-loom-pattern-53.md
  - name: filed_1
    check:
      all_of:
      - file_text_equals:
          path: $WS/北港/北港-航线图-18.log
          value: '北港-航线图-18.log

            '
      - file_absent:
          path: $WS/北港-航线图-18.log
  - name: filed_2
    check:
      all_of:
      - file_text_equals:
          path: $WS/青石/青石-梯田测绘-21.md
          value: '青石-梯田测绘-21.md

