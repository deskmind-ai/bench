# T7 v0 (deskmind#60, #62), test2: 开放目标「按项目整理」，有一个文件同属两个项目（问用户）. Names from T7's own pool, apart from the training fixtures and P03-P22. Evaluation only: no training, no tuning on it.
id: D-OG3-test2
title: T7 test2：开放目标「按项目整理」，有一个文件同属两个项目（问用户）
surface: finder
tags:
- dyn
- t7
- t7-test
- tier-o
- reaction
app: com.apple.finder
