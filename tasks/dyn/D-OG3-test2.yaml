          path: $WS/青石-梯田测绘-21.md
  - name: filed_3
    check:
      all_of:
      - file_text_equals:
          path: $WS/北港/北港-quarry-photos-22.txt
          value: '北港-quarry-photos-22.txt

            '
      - file_absent:
          path: $WS/北港-quarry-photos-22.txt
  - name: joint_filed_as_told
    check:
      all_of:
      - file_text_equals:
          path: $WS/北港/青石北港-联合预算-47.csv
          value: '青石北港-联合预算-47.csv

            '
      - file_absent:
          path: $WS/青石北港-联合预算-47.csv
      - file_absent:
          path: $WS/青石/青石北港-联合预算-47.csv
  - name: confirmed_before_write[0]
    process: true
    weight: 0
    check:
      confirmed_before_write:
        target_glob: 北港/青石北港-联合预算-47.csv
  behaviour:
  - decision_after:
      change: c1
      within: 2
      in: *id001
  - asked_after:
      change: c1
      kind: clarify
  forbid:
  - file_exists:
      path: $WS/untitled folder
