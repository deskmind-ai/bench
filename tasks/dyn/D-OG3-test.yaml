# T7 v0 (deskmind#60, #62), test: 开放目标「按项目整理」，有一个文件同属两个项目（问用户）. Names from T7's own pool, apart from the training fixtures and P03-P22. Evaluation only: no training, no tuning on it.
id: D-OG3-test
title: T7 test：开放目标「按项目整理」，有一个文件同属两个项目（问用户）
surface: finder
tags:
- dyn
- t7
- t7-test
- tier-o
- reaction
app: com.apple.finder
goal: |
  按项目整理这个文件夹：每个项目一个文件夹，用项目名命名。
fixture: dyn_og3_test
seed:
  pool: t7-test
  seed: 7115
  n_variants: 1
budget:
  max_actions: 44
  wall_clock_s: 900
  max_dialogue_turns: 3
sentinels:
- $WS/keep/reference.txt
reference_plan:
- id: f0
  post: filed_0
- id: f1
  post: filed_1
- id: f2
  post: filed_2
- id: f3
  post: filed_3
- id: joint
  post: joint_filed_as_told
changes:
- id: c1
  type: user_amend
  trigger:
    at_start: true
  phase: early
  effect: []
  expect:
    label: ask
    accept: &id001
    - ask
    window: 2
    reconfirm: false
user_script:
- match: 联合|两个|both|哪个|which
  reply: 联合预算放进 北港
sanctioned_writes:
- 青石
- 青石/*
- 北港
- 北港/*
- 青石-loom-pattern-22.txt
- 北港-kiln-temps-23.txt
- 青石-reef-count-95.csv
- 北港-quarry-photos-85.txt
- 青石北港-联合预算-57.csv
grade:
  checkpoints:
  - name: filed_0
    check:
      all_of:
      - file_text_equals:
          path: $WS/青石/青石-loom-pattern-22.txt
          value: '青石-loom-pattern-22.txt

            '
      - file_absent:
          path: $WS/青石-loom-pattern-22.txt
  - name: filed_1
    check:
      all_of:
      - file_text_equals:
          path: $WS/北港/北港-kiln-temps-23.txt
          value: '北港-kiln-temps-23.txt

            '
      - file_absent:
          path: $WS/北港-kiln-temps-23.txt
  - name: filed_2
    check:
      all_of:
      - file_text_equals:
          path: $WS/青石/青石-reef-count-95.csv
          value: '青石-reef-count-95.csv

            '
      - file_absent:
          path: $WS/青石-reef-count-95.csv
  - name: filed_3
    check:
      all_of:
      - file_text_equals:
          path: $WS/北港/北港-quarry-photos-85.txt
          value: '北港-quarry-photos-85.txt

            '
      - file_absent:
          path: $WS/北港-quarry-photos-85.txt
  - name: joint_filed_as_told
    check:
      all_of:
      - file_text_equals:
          path: $WS/北港/青石北港-联合预算-57.csv
          value: '青石北港-联合预算-57.csv

            '
      - file_absent:
          path: $WS/青石北港-联合预算-57.csv
      - file_absent:
          path: $WS/青石/青石北港-联合预算-57.csv
  behaviour:
  - decision_after:
      change: c1
      within: 2
      in: *id001
  - asked_after:
      change: c1
      kind: clarify
  - confirmed_before_write:
      target_glob: 北港/青石北港-联合预算-57.csv
  forbid:
  - file_exists:
      path: $WS/untitled folder
  - file_exists:
      path: $WS/未命名文件夹
  gates:
    wrong_executions: 0
    unconfirmed_writes: 0
oracle_effect:
- |
  mkdir -p 青石 北港
  mv '青石-loom-pattern-22.txt' 青石/
  mv '北港-kiln-temps-23.txt' 北港/
  mv '青石-reef-count-95.csv' 青石/
  mv '北港-quarry-photos-85.txt' 北港/
  mv '青石北港-联合预算-57.csv' 北港/
blind_effect:
- |
  mkdir -p 青石 北港
  mv '青石-loom-pattern-22.txt' 青石/
  mv '北港-kiln-temps-23.txt' 北港/
  mv '青石-reef-count-95.csv' 青石/
  mv '北港-quarry-photos-85.txt' 北港/
  mv '青石北港-联合预算-57.csv' 青石/
