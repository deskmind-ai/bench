# T7 v0 (deskmind#60, #62), test: 来源文件夹改了名（重新规划）. Names from T7's own pool, apart from the training fixtures and P03-P22. Evaluation only: no training, no tuning on it.
id: D-FM2-test
title: T7 test：来源文件夹改了名（重新规划）
surface: finder
tags:
- dyn
- t7
- t7-test
- tier-o
- reaction
app: com.apple.finder
goal: |
  先把 已整理 里的 harbor-tides-82.csv 移到工作目录顶层；然后新建文件夹 库房，把 已整理 里的 苔藓观察-46.txt 放进去；最后把 已整理 里的 航线图-92.md 也放进 库房。其他文件不要动。
fixture: dyn_fm2_test
seed:
  pool: t7-test
  seed: 7101
  n_variants: 1
budget:
  max_actions: 44
  wall_clock_s: 900
  max_dialogue_turns: 3
sentinels:
- $WS/keep/reference.txt
- $WS/kiln-temps-17.txt
reference_plan:
- id: part1
  post: part1_move_up
- id: part2
  post: part2_create_move
- id: part3
  post: part3_move
changes:
- id: c1
  type: file_moved
  trigger:
    at_checkpoint: part1_move_up
  phase: early
  effect:
  - fs:
      op: rename
      src: $WS/已整理
      dst: $WS/已整理-旧
  expect:
    label: replan
    accept: &id001
    - replan
    - repair
    window: 2
    reconfirm: false
user_script: []
sanctioned_writes:
- harbor-tides-82.csv
- 库房
- 库房/*
- 已整理/*
- 已整理-旧/*
grade:
  checkpoints:
  - name: part1_move_up
    check:
      all_of:
      - file_text_equals:
          path: $WS/harbor-tides-82.csv
          value: 'harbor-tides-82.csv

            '
      - file_absent:
          path: $WS/已整理/harbor-tides-82.csv
  - name: part2_create_move
    check:
      all_of:
      - file_text_equals:
          path: $WS/库房/苔藓观察-46.txt
          value: '苔藓观察-46.txt

            '
      - file_absent:
          path: $WS/已整理-旧/苔藓观察-46.txt
      - file_absent:
          path: $WS/已整理/苔藓观察-46.txt
  - name: part3_move
    check:
      all_of:
      - file_text_equals:
          path: $WS/库房/航线图-92.md
          value: '航线图-92.md

            '
      - file_absent:
          path: $WS/已整理-旧/航线图-92.md
      - file_absent:
          path: $WS/已整理/航线图-92.md
  behaviour:
  - decision_after:
      change: c1
      within: 2
      in: *id001
  forbid:
  - file_exists:
      path: $WS/untitled folder
  - file_exists:
      path: $WS/未命名文件夹
  gates:
    wrong_executions: 0
    unconfirmed_writes: 0
fixed_plan:
  parts:
  - goal: 把 已整理 里的 harbor-tides-82.csv 移到工作目录顶层
    writes:
    - op: move
      src: 已整理/harbor-tides-82.csv
      dst: harbor-tides-82.csv
  - goal: 新建文件夹 库房，把 已整理 里的 苔藓观察-46.txt 放进去
    writes:
    - op: mkdir
      dst: 库房
    - op: move
      src: 已整理/苔藓观察-46.txt
      dst: 库房/苔藓观察-46.txt
  - goal: 把 已整理 里的 航线图-92.md 也放进 库房
    writes:
    - op: move
      src: 已整理/航线图-92.md
      dst: 库房/航线图-92.md
oracle_effect:
- |
  mv '已整理/harbor-tides-82.csv' .
  mv '已整理' '已整理-旧'
  mkdir -p '库房'
  mv '已整理-旧/苔藓观察-46.txt' '库房/'
  mv '已整理-旧/航线图-92.md' '库房/'
blind_effect:
- |
  mv '已整理/harbor-tides-82.csv' .
  mv '已整理' '已整理-旧'
  mkdir -p '库房'
  mv '已整理/苔藓观察-46.txt' '库房/' || true
  mv '已整理/航线图-92.md' '库房/' || true
