[project]
name = "deskmind-bench"
version = "0.1.0"
description = "Sandbox macOS desktop tasks, their graders, and a driver-free scorer for computer-use agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "The DeskMind authors"}]
keywords = ["computer-use", "agents", "benchmark", "evaluation", "macos", "desktop"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# Executing runs on the desktop. Scoring, verifying and hashing never need it.
run = ["deskmind-hands"]

[project.urls]
Homepage = "https://github.com/deskmind-ai/bench"
Repository = "https://github.com/deskmind-ai/bench"
Issues = "https://github.com/deskmind-ai/bench/issues"

[project.scripts]
deskmind-bench = "deskmind_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deskmind_bench"]

[tool.uv.sources]
deskmind-hands = { git = "https://github.com/deskmind-ai/hands" }
