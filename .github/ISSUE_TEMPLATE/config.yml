# The org-wide bug and idea forms live in deskmind-ai/.github. A repository with its own ISSUE_TEMPLATE folder does not
# inherit them, so blank issues stay enabled here for bugs in the scorer and graders.
blank_issues_enabled: true
contact_links:
  - name: Questions and discussion · 提问与讨论
    url: https://github.com/orgs/deskmind-ai/discussions
    about: Ask anything, share results · 任何问题、分享成果
  - name: Org-wide issue forms and guidelines · 组织通用的 issue 表单与规范
    url: https://github.com/deskmind-ai/.github/tree/main/.github/ISSUE_TEMPLATE
    about: The bug report and idea forms every DeskMind repository follows · 所有得心仓库通用的问题反馈与想法表单
  - name: Security issue · 安全问题
    url: https://github.com/deskmind-ai/.github/blob/main/SECURITY.md
    about: Report privately, never in a public issue · 私下报告，不要公开提 issue
